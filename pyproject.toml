[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsanity"
version = "0.1.0"
description = "Contamination-Resistant ML Evaluation Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "EvalSanity"},
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.0",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "sentence-transformers>=2.2",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/anomalyco/evalsanity"
BugTracker = "https://github.com/anomalyco/evalsanity/issues"

[project.scripts]
evalsanity = "evalsanity.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
